    "id": "grande",
    "short_title": "GRANDE",
    "summary": "GRANDE brings gradient-based optimization to decision tree ensembles for tabular data. It jointly learns hard, axis-aligned splits, leaf values, and instance-wise leaf weights, combining tree structure with neural optimization.",
    "software_note": "The PyTorch package provides classification and regression estimators with a scikit-learn-style interface, built-in preprocessing, and CPU/GPU support. Example notebooks cover training and tuning; inspection tools expose individual trees, feature importances, instance-wise estimator weights, and readable rules.",
    "primary_link": "code",
    "paper_summary": "GRANDE learns ensembles of hard, axis-aligned decision trees end-to-end with gradient descent. A dense ensemble representation and a straight-through operator allow all model parameters to be optimized jointly. Instance-wise weighting lets the ensemble represent both simple and complex relationships. On the paper's benchmark of 19 classification datasets, it outperformed the evaluated gradient-boosting and deep learning methods on most datasets.",
